<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Map ♡ Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    #map {
      width: 100%;
      height: 60vh;
      min-height: 400px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      z-index: 1;
    }
    .custom-heart-pin {
      font-size: 1.8rem;
      text-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      line-height: 1;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 18px;
      padding: 6px;
      font-family: "DM Sans", sans-serif;
    }
    .popup-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .popup-card h4 {
      font-family: "Playfair Display", serif;
      margin: 0 0 4px;
      font-size: 1.1rem;
    }
    .popup-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <nav class="nav container detail-nav">
    <a class="brand" href="index.html">♡ us</a>
    <div class="nav-actions">
      <a class="back-link" href="index.html">← Timeline</a>
      <a class="admin-link" href="admin.html">Admin</a>
    </div>
  </nav>

  <main class="container main-content" style="padding-top: 20px;">
    <div class="section-heading" style="margin-bottom: 20px;">
      <div>
        <p class="eyebrow">Our World Pinboard</p>
        <h2>Places & Memories</h2>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="filter-all" class="count-pill" style="cursor: pointer; border: none;">All Pins</button>
        <button id="filter-visited" class="count-pill" style="cursor: pointer; border: none; background: #e3f2fd; color: #1e88e5;">♡ Visited</button>
        <button id="filter-wishlist" class="count-pill" style="cursor: pointer; border: none; background: #fff3e0; color: #f57c00;">✈️ Wishlist</button>
      </div>
    </div>

    <p style="color: var(--muted); margin-bottom: 15px; font-size: 0.9rem;">
      💡 <strong>Tip:</strong> Click anywhere on the map to pin a new memory or dream destination.
    </p>

    <!-- Map Element -->
    <div id="map"></div>

    <!-- Add Pin Modal Form -->
    <section id="add-pin-panel" class="panel hidden" style="margin-top: 25px;">
      <div class="panel-heading">
        <h2 id="pin-form-heading">Add a Pin</h2>
        <button id="close-pin-btn" class="text-button">Cancel ✕</button>
      </div>

      <form id="save-pin-form" class="form">
        <input id="pin-lat" type="hidden">
        <input id="pin-lng" type="hidden">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <label>
            Memory Title
            <input id="pin-title" type="text" required placeholder="e.g. Our Coffee Date in London">
          </label>
          <label>
            Location Name
            <input id="pin-location" type="text" placeholder="e.g. Soho, London">
          </label>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
          <label>
            Pin Type
            <select id="pin-type" style="padding: 12px; border-radius: 13px; border: 1px solid #e3d3d8; background: #fffafa;">
              <option value="visited">♡ Visited Together</option>
              <option value="wishlist">✈️ Wishlist Destination</option>
            </select>
          </label>
          <label>
            Date / Label
            <input id="pin-date" type="text" placeholder="e.g. Oct 2026">
          </label>
          <label>
            Added By
            <select id="pin-by" style="padding: 12px; border-radius: 13px; border: 1px solid #e3d3d8; background: #fffafa;">
              <option value="Aayush">Aayush</option>
              <option value="Sophie">Sophie</option>
            </select>
          </label>
        </div>

        <label>
          Photo URL (Optional)
          <input id="pin-image" type="url" placeholder="https://...">
        </label>

        <label>
          Memory / Note
          <textarea id="pin-note" rows="3" placeholder="What made this place special?"></textarea>
        </label>

        <button class="button primary" type="submit">Drop Pin ♡</button>
        <p id="pin-form-message" class="form-message"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Mapping out our story, one pin at a time. ♡</p>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/map.js"></script>
</body>
</html>
